project:
  name: financial-event-model
  timezone: Europe/Rome
  output_dir_local: ./data_pipeline
  output_dir_kaggle: /kaggle/working/data_pipeline

api_keys:
  alpaca_key_env: ALPACA_API_KEY
  alpaca_secret_env: ALPACA_SECRET_KEY
  alphavantage_key_env: ALPHAVANTAGE_API_KEY
  finnhub_key_env: FINNHUB_API_KEY
  sec_edgar_requires_key: false

local_paths:
  symbol_master: ./data_pipeline/symbol_master.csv
  sec_cik_list: ./data_pipeline/sec_ciks.csv
  raw_news: ./data_pipeline/raw_news.csv
  raw_news_enriched: ./data_pipeline/raw_news_enriched.csv
  bars_5m: ./data_pipeline/bars_5m.parquet
  dataset_event_model: ./data_pipeline/dataset_event_model.parquet
  model_artifacts: ./data_pipeline/event_model_artifacts

kaggle_paths:
  symbol_master: /kaggle/working/data_pipeline/symbol_master.csv
  sec_cik_list: /kaggle/input/your-sec-cik-dataset/sec_ciks.csv
  raw_news: /kaggle/working/data_pipeline/raw_news.csv
  raw_news_enriched: /kaggle/working/data_pipeline/raw_news_enriched.csv
  bars_5m: /kaggle/working/data_pipeline/bars_5m.parquet
  dataset_event_model: /kaggle/working/data_pipeline/dataset_event_model.parquet
  model_artifacts: /kaggle/working/event_model_artifacts

