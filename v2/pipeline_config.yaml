bars_download:
  timeframe_amount: 5
  feed: iex
  batch_size: 5
  start: 2020-01-01
  end: 2026-05-10
  limit_symbols: 0

training:
  model_name: ProsusAI/finbert
  epochs: 3
  batch_size: 16
  lr: 0.00002
  max_len: 192
  th_5m: 0.0025
  th_15m: 0.0040
  th_30m: 0.0060
  th_60m: 0.0090
